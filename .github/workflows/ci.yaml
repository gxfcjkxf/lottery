      TEST_RECONCILIATION_ADMIN_USERNAME: ci_reconciliation_operator
      TEST_RECONCILIATION_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
      BOOTSTRAP_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Prepare and verify Chromium
        timeout-minutes: 7
        run: node scripts/prepare-ci-browser.mjs
      - name: Start dedicated reconciliation fixture and API
        working-directory: backend
        run: |
          go test -tags browserfixture ./cmd/reconciliation-fixture
          go build -o bin/platform ./cmd/platform
          ./bin/platform migrate
          ./bin/platform seed
          ./bin/platform generate-auth-key .local/auth.key
          ./bin/platform create-admin --username ci_reconciliation_operator --brand harbor
          go run -tags browserfixture ./cmd/reconciliation-fixture
          go run -tags browserfixture ./cmd/reconciliation-fixture verify > ../reconciliation-fingerprint-before.txt
          ./bin/platform serve > ../reconciliation-api.log 2>&1 &
          ./bin/platform worker > ../reconciliation-worker.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8080/health/ready
      - run: pnpm exec playwright test tests/browser/reconciliation.spec.ts tests/browser/business-inventory.spec.ts --project=${{ matrix.project }} --workers=1 --retries=0
      - name: Verify complete owned financial history after readonly checks
        working-directory: backend
        run: |
          go run -tags browserfixture ./cmd/reconciliation-fixture verify > ../reconciliation-fingerprint-after.txt
          cmp ../reconciliation-fingerprint-before.txt ../reconciliation-fingerprint-after.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reconciliation-browser-failure-${{ matrix.project }}
          path: test-results/
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:check
      - run: pnpm test:contracts
  backend-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet backend packages
        run: go vet ./...
        working-directory: backend
      - name: Unit checks only, not database/financial acceptance
        run: go test -count=1 -timeout=2m ./...
        working-directory: backend
      - name: Build platform
        run: go build ./cmd/platform
        working-directory: backend
  backend:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [core, betting, commission]
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lottery_test
          POSTGRES_USER: lottery_test
          POSTGRES_PASSWORD: local_test_password
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lottery_test -d lottery_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://lottery_test:local_test_password@localhost:5432/lottery_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet backend packages
        if: ${{ matrix.group == 'core' }}
        run: go vet ./...
        working-directory: backend
      # Real PostgreSQL migrations and boundary waits share each package's
      # test timer; independent matrix jobs isolate core, betting, and the
      # slower commission boundary suite while keeping each test timeout at 20m.
      - name: Verify betting test split against actual inventory
        if: ${{ matrix.group == 'core' }}
        run: bash ../scripts/verify-betting-test-split.sh
        working-directory: backend
      - name: Run betting commission tests
        if: ${{ matrix.group == 'commission' }}
        run: go test -race -count=1 -timeout=20m ./internal/betting -run '^TestCommission'
        working-directory: backend
      - name: Run remaining betting tests
        if: ${{ matrix.group == 'betting' }}
        run: go test -race -count=1 -timeout=20m ./internal/betting -skip '^TestCommission'
        working-directory: backend
      - name: Run all non-betting packages
        if: ${{ matrix.group == 'core' }}
        shell: bash
        run: |
          set -euo pipefail
          betting_package="$(go list ./internal/betting)"
          all_package_output="$(go list ./...)"
          all_packages=()
          while IFS= read -r package; do
            all_packages+=("$package")
          done <<<"$all_package_output"
          if ! printf '%s\n' "${all_packages[@]}" | grep -Fxq "$betting_package"; then
            echo "betting package $betting_package is missing from go list ./..." >&2
            exit 1
          fi
          non_betting_packages=()
          for package in "${all_packages[@]}"; do
            if [[ "$package" == "$betting_package" ]]; then
              continue
            fi
            non_betting_packages+=("$package")
          done
          if [[ ${#non_betting_packages[@]} -eq 0 ]]; then
            echo 'go list ./... returned no non-betting packages' >&2
            exit 1
          fi
          go test -race -count=1 -timeout=20m "${non_betting_packages[@]}"
        working-directory: backend
      - run: go test -race -tags reportlimit -count=1 -timeout=20m ./internal/reporting -run '^TestReportExportActualDatabaseGroupBoundary$'
        if: ${{ matrix.group == 'core' }}
        working-directory: backend
      - name: Build platform
        if: ${{ matrix.group == 'core' }}
        run: go build ./cmd/platform
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
        # Independent runners/databases keep the real shared-IP auth budget
        # intact. No rate-limit bypass or cross-identity cookie reuse.
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lottery_test
          POSTGRES_USER: lottery_test
          POSTGRES_PASSWORD: local_test_password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lottery_test -d lottery_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://lottery_test:local_test_password@localhost:5432/lottery_test?sslmode=disable
      HTTP_ADDR: 127.0.0.1:8080
      AUTH_KEY_FILE: .local/auth.key
      # These credentials exist only in this ephemeral CI PostgreSQL database.
      TEST_ADMIN_USERNAME: ci_test_operator
      TEST_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
      TEST_HARBOR_ADMIN_USERNAME: ci_harbor_operator
      TEST_HARBOR_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
      TEST_RULE_REVIEWER_USERNAME: ci_rule_reviewer
      TEST_RULE_REVIEWER_PASSWORD: ci-isolated-test-only-password-2026
      TEST_PLATFORM_ADMIN_USERNAME: ci_platform_operator
      TEST_PLATFORM_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
      TEST_COMPLIANCE_ADMIN_USERNAME: ci_compliance_operator
      TEST_COMPLIANCE_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
      TEST_EXPORT_ADMIN_USERNAME: ci_export_operator
      TEST_EXPORT_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
      TEST_EXPORT_PLATFORM_USERNAME: ci_export_platform
      TEST_EXPORT_PLATFORM_PASSWORD: ci-isolated-test-only-password-2026
      TEST_TEMPLATE_ADMIN_USERNAME: ci_template_operator
      TEST_TEMPLATE_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
      BOOTSTRAP_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Prepare and verify Chromium
        timeout-minutes: 7
        run: node scripts/prepare-ci-browser.mjs
      - name: Start isolated test API
        working-directory: backend
        run: |
          go build -o bin/platform ./cmd/platform
          ./bin/platform migrate
          ./bin/platform seed
          ./bin/platform generate-auth-key .local/auth.key
          ./bin/platform create-admin --username ci_test_operator --brand aurora
          ./bin/platform create-admin --username ci_harbor_operator --brand harbor
          ./bin/platform create-admin --username ci_rule_reviewer --brand harbor
          ./bin/platform create-admin --username ci_platform_operator --super
          ./bin/platform create-admin --username ci_compliance_operator --brand harbor
          ./bin/platform create-admin --username ci_export_operator --brand harbor
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO admin_brand_scopes(account_id,brand_id)
            SELECT id,'0199a000-0000-7000-8000-000000000001'::uuid FROM admin_accounts WHERE username='ci_export_operator';
          INSERT INTO roles(id,brand_id,code,name,is_bootstrap)
            VALUES(gen_random_uuid(),'0199a000-0000-7000-8000-000000000001','ci_export_aurora_read','CI Aurora report reader',true);
          INSERT INTO admin_account_roles(account_id,role_id)
            SELECT a.id,r.id FROM admin_accounts a CROSS JOIN roles r WHERE a.username='ci_export_operator' AND r.code='ci_export_aurora_read';
          INSERT INTO role_permissions(role_id,permission_key)
            SELECT r.id,p.key FROM roles r CROSS JOIN permissions p
            WHERE r.code='ci_export_aurora_read' AND p.key IN('brand.view.brand','report_betting.view.brand','report_ledger.view.brand','report_ledger.export.brand');
          SQL
          ./bin/platform create-admin --username ci_export_platform --super
          ./bin/platform create-admin --username ci_template_operator --brand harbor
          ./bin/platform serve > ../api-test.log 2>&1 &
          ./bin/platform worker > ../worker-test.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8080/health/ready
      # Each viewport/shard gets an independent PostgreSQL service; preserve real auth limits.
      # Brand-level settings tests temporarily change the same Harbor config.
      # Serialize UI cases; transaction concurrency is exercised by Go tests.
      - run: pnpm test:e2e --project=${{ matrix.project }} --grep-invert='real report archives recover a lost committed receipt and keep old versions immutable|real automatic archive tasks recover the original retry receipt after worker completion|real archive policy activation recovers the original receipt after a later configuration change|real attribution reports preserve saved agent scope and export unique order totals|real Harbor draw notices publish and correct immutable facts on desktop and mobile|genuine brand audit filters and validated full CSV preserve finances on both layouts' --shard=${{ matrix.shard }}/2 --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
  newops-runtime:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lottery_ops_acceptance
          POSTGRES_USER: lottery_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: --health-cmd "pg_isready -U lottery_test -d lottery_ops_acceptance" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://lottery_test@127.0.0.1:5432/lottery_ops_acceptance?sslmode=disable
      OPS_RUNTIME_FIXTURE_CONFIRM: owned_synthetic_database
      PLATFORM_BIN: ${{ github.workspace }}/.local/ops-platform
      POSTGRES_PSQL_BIN: /usr/bin/psql
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Verify operations CI wiring
        run: node --test tests/static/ops-ci.test.mjs
      - name: Build the normal platform CLI
        run: |
          mkdir -p .local
          go -C backend build -o "$PLATFORM_BIN" ./cmd/platform
      - name: Install pinned Prometheus promtool
        run: node scripts/install-promtool.mjs
      - name: Check operational monitoring configuration and rules
        run: node scripts/verify-monitoring.mjs
      - name: Run real isolated operations runtime acceptance
        run: node scripts/verify-ops-runtime.mjs
