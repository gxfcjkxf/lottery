          node --input-type=module -e 'import { readFileSync } from "node:fs"; const { stats } = JSON.parse(readFileSync(process.env.PLAYWRIGHT_JSON_OUTPUT_NAME, "utf8")); if (stats.skipped !== 0 || !(stats.expected > 0)) throw new Error("Commission correction CI requires passed tests and zero skipped tests");'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: commission-corrections-${{ matrix.viewport }}-failure-traces
          path: |
            test-results/
            .local/commission-corrections-report.json
