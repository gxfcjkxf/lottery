      REPORT_ATTRIBUTION_FIXTURE_CONFIRM: owned_synthetic_database
      TEST_DRAW_NOTICE_ADMIN_ORIGIN: http://localhost:5174
      TEST_DRAW_NOTICE_USER_ORIGIN: http://localhost:5173
      TEST_ATTRIBUTION_ADMIN_USERNAME: attribution_browser_${{ matrix.viewport }}
      TEST_ATTRIBUTION_ADMIN_PASSWORD: attribution-owned-harbor-admin-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Prepare and verify Chromium
        timeout-minutes: 7
        run: node scripts/prepare-ci-browser.mjs
      - name: Initialize owned draw notice database with normal CLI and start API and worker
        run: |
          mkdir -p .local
          go -C backend build -o ../.local/draw-notification-platform ./cmd/platform
          .local/draw-notification-platform generate-auth-key .local/auth.key
          export PLATFORM_BIN="$PWD/.local/draw-notification-platform"
          node scripts/init-attribution-browser.mjs
          .local/draw-notification-platform serve > draw-notifications-api.log 2>&1 &
          .local/draw-notification-platform worker > draw-notifications-worker.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8080/health/ready
      - name: Run genuine published and corrected notices without skips
        run: |
          pnpm exec playwright test --config=playwright.draw-notifications.config.ts --project=${{ matrix.viewport }} --workers=1 --retries=0
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const { stats } = JSON.parse(readFileSync(".local/draw-notifications-browser-report.json", "utf8")); if (stats.skipped !== 0 || stats.unexpected !== 0 || stats.flaky !== 0 || stats.expected !== 1) throw new Error("Draw notice CI requires exactly one passed test and zero skips or retries");'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: draw-notifications-${{ matrix.viewport }}-failure-traces
          path: |
            test-results/
            .local/draw-notifications-browser-report.json
            draw-notifications-api.log
            draw-notifications-worker.log
