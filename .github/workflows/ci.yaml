name: check
run-name: "${{ github.event_name == 'workflow_dispatch' && 'Full regression' || 'Quick checks' }} · ${{ github.ref_name }}"
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  webkit-functional:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lottery_webkit_test
          POSTGRES_USER: lottery_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: --health-cmd "pg_isready -U lottery_test -d lottery_webkit_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://lottery_test@127.0.0.1:5432/lottery_webkit_test?sslmode=disable
      HTTP_ADDR: 127.0.0.1:8080
      AUTH_KEY_FILE: ${{ github.workspace }}/.local/webkit-auth.key
      TEST_ADMIN_USERNAME: ci_webkit_aurora
      TEST_ADMIN_PASSWORD: ci-webkit-owned-password-2026
      TEST_HARBOR_ADMIN_USERNAME: ci_webkit_harbor
      TEST_HARBOR_ADMIN_PASSWORD: ci-webkit-owned-password-2026
      TEST_COMPLIANCE_ADMIN_USERNAME: ci_webkit_compliance
      TEST_COMPLIANCE_ADMIN_PASSWORD: ci-webkit-owned-password-2026
      BOOTSTRAP_ADMIN_PASSWORD: ci-webkit-owned-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Install locked WebKit and Linux dependencies
        timeout-minutes: 7
        run: pnpm exec playwright install --with-deps webkit
      - name: Verify WebKit launch and record its executable
        run: |
          node --input-type=module <<'JS'
          import { webkit } from '@playwright/test';
          import { appendFileSync } from 'node:fs';
          const browser = await webkit.launch({ headless: true, timeout: 15000 });
          try {
            const page = await browser.newPage();
            await page.setContent('<p>WebKit ready</p>');
            if (await page.textContent('p') !== 'WebKit ready') throw new Error('WebKit launch probe failed');
            appendFileSync(process.env.GITHUB_ENV, `PLAYWRIGHT_WEBKIT_EXECUTABLE_PATH=${webkit.executablePath()}\n`);
          } finally { await browser.close(); }
          JS
      - name: Initialize isolated baseline and explicit brand accounts
        run: |
          mkdir -p .local
          go -C backend build -o ../.local/webkit-platform ./cmd/platform
          .local/webkit-platform migrate
          .local/webkit-platform seed
          .local/webkit-platform generate-auth-key "$AUTH_KEY_FILE"
          .local/webkit-platform create-admin --username "$TEST_ADMIN_USERNAME" --brand aurora
          .local/webkit-platform create-admin --username "$TEST_HARBOR_ADMIN_USERNAME" --brand harbor
          .local/webkit-platform create-admin --username "$TEST_COMPLIANCE_ADMIN_USERNAME" --brand harbor
          .local/webkit-platform serve > .local/webkit-api.log 2>&1 &
          .local/webkit-platform worker > .local/webkit-worker.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/health/ready
      - name: Run WebKit functional scenarios without test retries
        run: pnpm test:webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webkit-functional-failure
          include-hidden-files: true
          path: |
            test-results/
            .local/webkit-api.log
            .local/webkit-worker.log
  pwa-production-cache:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Prepare and verify Chromium
        timeout-minutes: 7
        run: node scripts/prepare-ci-browser.mjs
      - name: Pin installed Chromium for production PWA verification
        run: node --input-type=module -e 'import { chromium } from "@playwright/test"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, `PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${chromium.executablePath()}\n`);'
      - name: Verify production service workers and isolated cache boundaries
        run: pnpm test:pwa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pwa-production-cache-failure
          path: test-results/
  administration-entries:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop1440, mobile360]
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lottery_admin_entries_${{ matrix.viewport }}
          POSTGRES_USER: lottery_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: --health-cmd "pg_isready -U lottery_test -d lottery_admin_entries_${{ matrix.viewport }}" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://lottery_test@127.0.0.1:5432/lottery_admin_entries_${{ matrix.viewport }}?sslmode=disable
      HTTP_ADDR: 127.0.0.1:8085
      AUTH_KEY_FILE: ${{ github.workspace }}/.local/review-auth.key
      TEST_REVIEW_ADMIN_PASSWORD: ci-owned-review-entry-password-2026
      TEST_PLATFORM_ADMIN_USERNAME: review_platform_{project}
      TEST_PLATFORM_ADMIN_PASSWORD: ci-owned-review-entry-password-2026
      TEST_PLATFORM_ADMIN_ORIGIN: http://127.0.0.1:5185
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Prepare and verify Chromium
        run: node scripts/prepare-ci-browser.mjs
      - name: Pin the installed Chromium executable for the review suite
        run: node --input-type=module -e 'import { chromium } from "@playwright/test"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, `PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${chromium.executablePath()}\n`);'
      - name: Initialize isolated current baseline and independent administrator accounts
        run: |
          mkdir -p .local
          go -C backend build -o ../.local/review-platform ./cmd/platform
          .local/review-platform generate-auth-key "$AUTH_KEY_FILE"
          .local/review-platform migrate
          .local/review-platform seed
          BOOTSTRAP_ADMIN_PASSWORD="$TEST_REVIEW_ADMIN_PASSWORD" .local/review-platform create-admin --username review_operator --brand aurora
          BOOTSTRAP_ADMIN_PASSWORD="$TEST_REVIEW_ADMIN_PASSWORD" .local/review-platform create-admin --username review_operator_desktop1440 --brand aurora
          BOOTSTRAP_ADMIN_PASSWORD="$TEST_REVIEW_ADMIN_PASSWORD" .local/review-platform create-admin --username review_operator_mobile360 --brand aurora
          BOOTSTRAP_ADMIN_PASSWORD="$TEST_REVIEW_ADMIN_PASSWORD" .local/review-platform create-admin --username review_platform --super
          BOOTSTRAP_ADMIN_PASSWORD="$TEST_REVIEW_ADMIN_PASSWORD" .local/review-platform create-admin --username review_platform_desktop1440 --super
          BOOTSTRAP_ADMIN_PASSWORD="$TEST_REVIEW_ADMIN_PASSWORD" .local/review-platform create-admin --username review_platform_mobile360 --super
          BOOTSTRAP_ADMIN_PASSWORD="$TEST_REVIEW_ADMIN_PASSWORD" .local/review-platform create-admin --username review_reports_desktop1440 --super
          BOOTSTRAP_ADMIN_PASSWORD="$TEST_REVIEW_ADMIN_PASSWORD" .local/review-platform create-admin --username review_reports_mobile360 --super
          BOOTSTRAP_ADMIN_PASSWORD="$TEST_REVIEW_ADMIN_PASSWORD" .local/review-platform create-admin --username review_exports_desktop1440 --super
          BOOTSTRAP_ADMIN_PASSWORD="$TEST_REVIEW_ADMIN_PASSWORD" .local/review-platform create-admin --username review_exports_mobile360 --super
          .local/review-platform serve > .local/review-api.log 2>&1 &
          .local/review-platform worker > .local/review-worker.log 2>&1 &
          pnpm review:user > .local/review-user.log 2>&1 &
          pnpm review:admin > .local/review-admin.log 2>&1 &
          pnpm review:platform > .local/review-platform.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8085/health/ready
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:5183/
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:5184/
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:5185/
      - name: Verify real isolated administrative entries without retries
        run: pnpm exec playwright test --config=playwright.review.config.ts --project=${{ matrix.viewport }} --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: administration-entry-${{ matrix.viewport }}-failure
          include-hidden-files: true
          path: |
            test-results/
            .local/review-*.log
  audit-exports-browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
