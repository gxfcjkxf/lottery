name: check
on: [push, pull_request]
jobs:
  audit-exports-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lottery_attribution_browser_${{ matrix.viewport }}
          POSTGRES_USER: lottery_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports: ["127.0.0.1:5432:5432"]
        options: --health-cmd "pg_isready -U lottery_test -d lottery_attribution_browser_${{ matrix.viewport }}" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://lottery_test@127.0.0.1:5432/lottery_attribution_browser_${{ matrix.viewport }}?sslmode=disable
      HTTP_ADDR: 127.0.0.1:8080
      AUTH_KEY_FILE: .local/auth.key
      PLATFORM_BIN: .local/audit-export-platform
      REPORT_ATTRIBUTION_VIEWPORT: ${{ matrix.viewport }}
      REPORT_ATTRIBUTION_FIXTURE_CONFIRM: owned_synthetic_database
      TEST_AUDIT_ADMIN_ORIGIN: http://localhost:5174
      TEST_ATTRIBUTION_ADMIN_USERNAME: attribution_browser_${{ matrix.viewport }}
      TEST_ATTRIBUTION_ADMIN_PASSWORD: attribution-owned-harbor-admin-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Prepare and verify Chromium
        timeout-minutes: 7
        run: node scripts/prepare-ci-browser.mjs
      - name: Initialize owned audit database and start normal API
        run: |
          mkdir -p .local
          go -C backend build -o ../.local/audit-export-platform ./cmd/platform
          .local/audit-export-platform generate-auth-key .local/auth.key
          export PLATFORM_BIN="$PWD/.local/audit-export-platform"
          node scripts/init-attribution-browser.mjs
          .local/audit-export-platform serve > audit-exports-api.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8080/health/ready
      - name: Verify genuine filtered CSV download without skips or retries
        run: |
          pnpm exec playwright test --config=playwright.audit-exports.config.ts --project=${{ matrix.viewport }} --workers=1 --retries=0
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const { stats } = JSON.parse(readFileSync(".local/audit-exports-browser-report.json", "utf8")); if (stats.skipped !== 0 || stats.unexpected !== 0 || stats.flaky !== 0 || stats.expected !== 1) throw new Error("Audit export CI requires exactly one passed test and zero skips or retries");'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: audit-exports-${{ matrix.viewport }}-failure-traces
          path: |
            test-results/
            .local/audit-exports-browser-report.json
            audit-exports-api.log
  draw-notifications-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    services:
      postgres:
