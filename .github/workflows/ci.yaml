name: check
on: [push, pull_request]
jobs:
  commission-cycles-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lottery_commission_ui_${{ matrix.viewport }}_s16
          POSTGRES_USER: lottery_test
          POSTGRES_PASSWORD: local_test_password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lottery_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://lottery_test:local_test_password@localhost:5432/lottery_commission_ui_${{ matrix.viewport }}_s16?sslmode=disable
      TEST_DATABASE_URL: postgres://lottery_test:local_test_password@localhost:5432/lottery_commission_ui_${{ matrix.viewport }}_s16?sslmode=disable
      HTTP_ADDR: 127.0.0.1:8080
      AUTH_KEY_FILE: .local/auth.key
      COMMISSION_FIXTURE_CONFIRM: owned_synthetic_database
      COMMISSION_FIXTURE_ADMIN_PASSWORD: commission-ui-owned-admin-password-2026
      COMMISSION_FIXTURE_USER_PASSWORD: commission-ui-owned-user-password-2026
      COMMISSION_FIXTURE_BIN: backend/bin/commission-fixture
      TEST_COMMISSION_ADMIN_PASSWORD: commission-ui-owned-admin-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Create owned real commission workflows and start API
        working-directory: backend
        run: |
          go test -count=1 -tags browserfixture ./cmd/commission-fixture
          go build -tags browserfixture -o bin/commission-fixture ./cmd/commission-fixture
          go build -o bin/platform ./cmd/platform
          ./bin/platform generate-auth-key .local/auth.key
          ./bin/commission-fixture init
          ./bin/platform serve > ../commission-cycles-api.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8080/health/ready
      # The test advances real workers explicitly between lost/replayed
      # receipts. No always-running worker races the unregistered anchor.
      - run: pnpm exec playwright test tests/browser/commission-cycles.spec.ts --project=${{ matrix.viewport }} --workers=1 --retries=0
      - run: pnpm exec playwright test tests/browser/commission-payments.spec.ts --project=${{ matrix.viewport }} --workers=1 --retries=0
      - run: pnpm exec playwright test tests/browser/commission-adjustments.spec.ts --project=${{ matrix.viewport }} --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: commission-cycles-${{ matrix.viewport }}-failure-traces
          path: test-results/
  withdrawal-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lottery_withdrawal_ui_s8
          POSTGRES_USER: lottery_test
          POSTGRES_PASSWORD: local_test_password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lottery_test -d lottery_withdrawal_ui_s8" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://lottery_test:local_test_password@localhost:5432/lottery_withdrawal_ui_s8?sslmode=disable
      HTTP_ADDR: 127.0.0.1:8080
      AUTH_KEY_FILE: .local/auth.key
      # Credentials belong only to this disposable synthetic PostgreSQL service.
      WITHDRAWAL_FIXTURE_CONFIRM: owned_synthetic_database
      WITHDRAWAL_FIXTURE_ADMIN_PASSWORD: ci-withdrawal-test-only-password-2026
      WITHDRAWAL_FIXTURE_USER_PASSWORD: ci-withdrawal-test-only-password-2026
      TEST_WITHDRAWAL_ADMIN_USERNAME: withdraw_admin
      TEST_WITHDRAWAL_ADMIN_PASSWORD: ci-withdrawal-test-only-password-2026
      TEST_WITHDRAWAL_USER_PASSWORD: ci-withdrawal-test-only-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start owned withdrawal fixture API and notification worker
        working-directory: backend
        run: |
          go test -tags browserfixture ./cmd/withdrawal-fixture
          go build -o bin/platform ./cmd/platform
          ./bin/platform generate-auth-key .local/auth.key
          go run -tags browserfixture ./cmd/withdrawal-fixture
          ./bin/platform serve > ../withdrawal-api.log 2>&1 &
          ./bin/platform worker > ../withdrawal-worker.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8080/health/ready
      # These steps share one owned fixture: desktop refunds, then mobile pays;
      # only afterward can both viewports verify the finished queue and inbox.
      - run: pnpm exec playwright test tests/browser/withdrawal-orders.spec.ts --project=desktop --workers=1 --retries=0
      - run: pnpm exec playwright test tests/browser/withdrawal-orders.spec.ts --project=mobile --workers=1 --retries=0
      - run: pnpm exec playwright test tests/browser/withdrawal-observability.spec.ts --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: withdrawal-browser-failure-traces
          path: test-results/
  qualification-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lottery_withdrawal_qualification_s9
          POSTGRES_USER: lottery_test
          POSTGRES_PASSWORD: local_test_password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lottery_test -d lottery_withdrawal_qualification_s9" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://lottery_test:local_test_password@localhost:5432/lottery_withdrawal_qualification_s9?sslmode=disable
      HTTP_ADDR: 127.0.0.1:8080
      AUTH_KEY_FILE: .local/auth.key
      WITHDRAWAL_QUAL_FIXTURE_CONFIRM: owned_synthetic_database
      WITHDRAWAL_QUAL_FIXTURE_ADMIN_PASSWORD: ci-qualification-fixture-admin-2026
      WITHDRAWAL_QUAL_FIXTURE_USER_PASSWORD: ci-qualification-fixture-user-2026
      TEST_QUAL_ADMIN_USERNAME: qual_admin
      TEST_QUAL_ADMIN_PASSWORD: ci-qualification-fixture-admin-2026
      TEST_QUAL_USER_PASSWORD: ci-qualification-fixture-user-2026
      TEST_QUAL_USER_ORIGIN: http://localhost:5173
      TEST_QUAL_ADMIN_ORIGIN: http://localhost:5174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Migrate isolated database and create real qualification fixture
        working-directory: backend
        run: |
          go test -tags browserfixture ./cmd/qualification-fixture
          go build -o bin/platform ./cmd/platform
          ./bin/platform migrate
          ./bin/platform seed
          ./bin/platform generate-auth-key .local/auth.key
          go run -tags browserfixture ./cmd/qualification-fixture
          ./bin/platform serve > ../qualification-api.log 2>&1 &
          ./bin/platform worker > ../qualification-worker.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8080/health/ready
      - run: pnpm exec playwright test tests/browser/withdrawal-qualification.spec.ts --project=desktop --workers=1 --retries=0
      - run: pnpm exec playwright test tests/browser/withdrawal-qualification.spec.ts --project=mobile --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qualification-browser-failure-traces
          path: test-results/
  reconciliation-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lottery_reconciliation_browser
          POSTGRES_USER: lottery_test
          POSTGRES_PASSWORD: local_test_password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lottery_test -d lottery_reconciliation_browser" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://lottery_test:local_test_password@localhost:5432/lottery_reconciliation_browser?sslmode=disable
      HTTP_ADDR: 127.0.0.1:8080
      AUTH_KEY_FILE: .local/auth.key
      RECONCILIATION_FIXTURE_CONFIRM: owned_synthetic_database
      TEST_RECONCILIATION_ADMIN_USERNAME: ci_reconciliation_operator
      TEST_RECONCILIATION_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
      BOOTSTRAP_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start dedicated reconciliation fixture and API
        working-directory: backend
        run: |
          go test -tags browserfixture ./cmd/reconciliation-fixture
          go build -o bin/platform ./cmd/platform
          ./bin/platform migrate
          ./bin/platform seed
          ./bin/platform generate-auth-key .local/auth.key
          ./bin/platform create-admin --username ci_reconciliation_operator --brand harbor
          go run -tags browserfixture ./cmd/reconciliation-fixture
          ./bin/platform serve > ../reconciliation-api.log 2>&1 &
          ./bin/platform worker > ../reconciliation-worker.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8080/health/ready
      - run: pnpm exec playwright test tests/browser/reconciliation.spec.ts --project=${{ matrix.project }} --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reconciliation-browser-failure-${{ matrix.project }}
          path: test-results/
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:check
      - run: pnpm test:contracts
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lottery_test
          POSTGRES_USER: lottery_test
          POSTGRES_PASSWORD: local_test_password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lottery_test -d lottery_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://lottery_test:local_test_password@localhost:5432/lottery_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
        working-directory: backend
      # Real PostgreSQL migrations and boundary waits share each package's
      # total timer; keep full race coverage with an explicit bounded budget.
      - run: go test -race -count=1 -timeout=20m ./...
        working-directory: backend
      - run: go test -tags reportlimit -count=1 ./internal/reporting -run '^TestReportExportActualDatabaseGroupBoundary$'
        working-directory: backend
      - run: go build ./cmd/platform
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
        # Independent runners/databases keep the real shared-IP auth budget
        # intact. No rate-limit bypass or cross-identity cookie reuse.
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lottery_test
          POSTGRES_USER: lottery_test
          POSTGRES_PASSWORD: local_test_password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lottery_test -d lottery_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://lottery_test:local_test_password@localhost:5432/lottery_test?sslmode=disable
      HTTP_ADDR: 127.0.0.1:8080
      AUTH_KEY_FILE: .local/auth.key
      # These credentials exist only in this ephemeral CI PostgreSQL database.
      TEST_ADMIN_USERNAME: ci_test_operator
      TEST_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
      TEST_HARBOR_ADMIN_USERNAME: ci_harbor_operator
      TEST_HARBOR_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
      TEST_RULE_REVIEWER_USERNAME: ci_rule_reviewer
      TEST_RULE_REVIEWER_PASSWORD: ci-isolated-test-only-password-2026
      TEST_PLATFORM_ADMIN_USERNAME: ci_platform_operator
      TEST_PLATFORM_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
      TEST_COMPLIANCE_ADMIN_USERNAME: ci_compliance_operator
      TEST_COMPLIANCE_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
      TEST_EXPORT_ADMIN_USERNAME: ci_export_operator
      TEST_EXPORT_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
      TEST_EXPORT_PLATFORM_USERNAME: ci_export_platform
      TEST_EXPORT_PLATFORM_PASSWORD: ci-isolated-test-only-password-2026
      TEST_TEMPLATE_ADMIN_USERNAME: ci_template_operator
      TEST_TEMPLATE_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
      BOOTSTRAP_ADMIN_PASSWORD: ci-isolated-test-only-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated test API
        working-directory: backend
        run: |
          go build -o bin/platform ./cmd/platform
          ./bin/platform migrate
          ./bin/platform seed
          ./bin/platform generate-auth-key .local/auth.key
          ./bin/platform create-admin --username ci_test_operator --brand aurora
          ./bin/platform create-admin --username ci_harbor_operator --brand harbor
          ./bin/platform create-admin --username ci_rule_reviewer --brand harbor
          ./bin/platform create-admin --username ci_platform_operator --super
          ./bin/platform create-admin --username ci_compliance_operator --brand harbor
          ./bin/platform create-admin --username ci_export_operator --brand harbor
          ./bin/platform create-admin --username ci_export_platform --super
          ./bin/platform create-admin --username ci_template_operator --brand harbor
          ./bin/platform serve > ../api-test.log 2>&1 &
          ./bin/platform worker > ../worker-test.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8080/health/ready
      # Each viewport/shard gets an independent PostgreSQL service; preserve real auth limits.
      # Brand-level settings tests temporarily change the same Harbor config.
      # Serialize UI cases; transaction concurrency is exercised by Go tests.
      - run: pnpm test:e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
